options:
- display: GroupBox
  category: [Smarter Patrols]
  header: '{{patrol_group}}'
  text: '{{patrol_group_descr}}'
  hasHeader: true
  children:
  - url: smarter-patrols.patrol.enabled
    name: smarter-patrols-patrol-enabled
    text: '{{patrol_enabled}}'
    tooltip: '{{patrol_enabled_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: smarter-patrols.patrol.groups
    name: smarter-patrols-patrol-groups
    text: '{{patrol_groups}}'
    tooltip: '{{patrol_groups_tooltip}}'
    display: Number
    contents:
      type: integer
      value: 0
      min: 0
      max: 12
      step: 1
  - url: smarter-patrols.patrol.distance
    name: smarter-patrols-patrol-distance
    text: '{{patrol_distance}}'
    tooltip: '{{patrol_distance_tooltip}}'
    display: Number
    contents:
      type: integer
      value: 12
      min: 4
      max: 100
      step: 1

- display: GroupBox
  category: [Smarter Patrols]
  header: '{{siegedef_group}}'
  text: '{{siegedef_group_descr}}'
  hasHeader: true
  children:
  - url: smarter-patrols.siegedef.enabled
    name: smarter-patrols-siegedef-enabled
    text: '{{siegedef_enabled}}'
    tooltip: '{{siegedef_enabled_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: true
  - url: smarter-patrols.siegedef.groups
    name: smarter-patrols-siegedef-groups
    text: '{{siegedef_groups}}'
    tooltip: '{{siegedef_groups_tooltip}}'
    display: Number
    contents:
      type: integer
      value: 4
      min: 0
      max: 12
      step: 1
  - url: smarter-patrols.siegedef.forward
    name: smarter-patrols-siegedef-forward
    text: '{{siegedef_forward}}'
    tooltip: '{{siegedef_forward_tooltip}}'
    display: Number
    contents:
      type: integer
      value: 4
      min: 0
      max: 10
      step: 1

- display: GroupBox
  category: [Smarter Patrols]
  header: '{{general_group}}'
  text: '{{general_group_descr}}'
  hasHeader: true
  children:
  - url: smarter-patrols.general.min_size
    name: smarter-patrols-general-min-size
    text: '{{general_min_size}}'
    tooltip: '{{general_min_size_tooltip}}'
    display: Number
    contents:
      type: integer
      value: 4
      min: 1
      max: 50
      step: 1

- display: GroupBox
  category: [Smarter Patrols]
  header: '{{diagnostics_group}}'
  text: '{{diagnostics_group_descr}}'
  hasHeader: true
  children:
  - url: smarter-patrols.diagnostics.log
    name: smarter-patrols-diagnostics-log
    text: '{{diagnostics_log}}'
    tooltip: '{{diagnostics_log_tooltip}}'
    display: Switch
    contents:
      type: boolean
      value: false
